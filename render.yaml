# Render blueprint. Point Render at this repo and it reads this file instead of asking you to
# fill in a form: https://render.com/docs/blueprint-spec
#
# One web service. The build compiles the React app; the Node process serves both that and the
# API on the port Render assigns, so there is nothing to wire together and no CORS to configure.

services:
  - type: web
    name: options-advisor
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start

    # Exempt from the password gate, deliberately: Render's checker cannot supply credentials,
    # and a health check that always 401s reads as a dead service.
    healthCheckPath: /api/health

    envVars:
      # Render applies this during the build too, and npm reads it: with NODE_ENV=production,
      # `npm install` silently skips devDependencies — which is where Vite lives. That is why
      # the root build script installs the web workspace with --include=dev.
      - key: NODE_ENV
        value: production

      # Start on synthetic chains so the first deploy is green before any token exists.
      # Switch to "tradier" in the Render dashboard once TRADIER_TOKEN is set.
      - key: PROVIDER
        value: mock

      - key: TRADIER_MODE
        value: sandbox

      # Left blank on purpose: a token in a git repo is a token you have to rotate. Paste it
      # into the Render dashboard, where it is stored as a secret.
      - key: TRADIER_TOKEN
        sync: false

      # --- accounts ---
      #
      # Leave DATABASE_URL blank and the app is single-user behind APP_PASSWORD below. Paste a
      # Postgres connection string in the dashboard and it becomes multi-user: everyone signs in
      # and keeps their own watchlist.
      #
      # Not a Render Postgres unless you intend to pay: the free one is deleted 30 days after
      # creation, and it would take every account with it. Neon and Supabase have free plans
      # that do not expire.
      - key: DATABASE_URL
        sync: false

      # The first administrator — only used when DATABASE_URL is set. Render generates the
      # password on first deploy; read it under Environment in the dashboard, sign in, then
      # change it on the Account page.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true

      # The single-user password gate, used only while DATABASE_URL is empty. Render generates
      # it on first deploy — read it under Environment. Without it the URL is open to anyone.
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        generateValue: true

# Note on the free plan: no persistent disk, so in single-user mode server/data/state.json is
# wiped on every deploy and every cold start and the watchlist reverts to its defaults. With
# DATABASE_URL set this does not apply — everything lives in Postgres. To keep the file instead,
# move to a paid instance and add:
#
#     disk:
#       name: data
#       mountPath: /var/data
#       sizeGB: 1
#
# with DATA_FILE=/var/data/state.json in envVars.
