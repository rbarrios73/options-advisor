<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The tab icon and the iOS home-screen icon are the monogram on a white tile: a transparent
         icon disappears into a dark browser tab, and iOS fills transparency with black. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Dark by design, and saying so stops the browser painting a white frame around the app
         before the stylesheet lands. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1216" />

    <title>Option Advisor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
