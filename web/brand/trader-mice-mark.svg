<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tm-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2470e0"/>
      <stop offset="1" stop-color="#0b2a6b"/>
    </linearGradient>
    <linearGradient id="tm-tail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1d63d6"/>
      <stop offset="0.5" stop-color="#14a6a0"/>
      <stop offset="1" stop-color="#2fd07c"/>
    </linearGradient>
  </defs>
  <!-- tail: from the mouse's back, under its belly, then up past its nose as a rising arrow -->
  <path d="M30 76 C 8 84, 10 108, 40 108 C 82 108, 122 96, 140 36" fill="none" stroke="url(#tm-tail)" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M128 34 L 147 18 L 150 43 Z" fill="#2fd07c" stroke="#2fd07c" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ear, behind the head -->
  <circle cx="72" cy="45" r="15.5" fill="#2470e0"/>
  <circle cx="72" cy="45" r="8.5" fill="#9cc0f7"/>
  <!-- body, in profile: round back on the left, nose to the right -->
  <path d="M26 80 C 22 58, 42 44, 66 48 C 84 50, 98 56, 112 64 C 117 67, 116 71, 111 72 L 94 76 C 78 82, 56 88, 40 88 C 32 88, 27 85, 26 80 Z" fill="url(#tm-body)"/>
  <!-- eye and nose -->
  <circle cx="92" cy="60" r="3.8" fill="#ffffff"/>
  <circle cx="113" cy="67.5" r="3.4" fill="#2fd07c"/>
  <!-- three candles on its back: the trader -->
  <line x1="44" y1="58" x2="44" y2="80" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
  <rect x="40.5" y="63" width="7" height="11" rx="1.4" fill="#2fd07c"/>
  <line x1="56" y1="54" x2="56" y2="78" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
  <rect x="52.5" y="58" width="7" height="14" rx="1.4" fill="#2fd07c"/>
  <line x1="68" y1="60" x2="68" y2="82" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
  <rect x="64.5" y="64" width="7" height="10" rx="1.4" fill="#ffffff"/>
</svg>
